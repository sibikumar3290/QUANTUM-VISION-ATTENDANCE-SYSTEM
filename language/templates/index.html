<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexidigit.ai | Voice Translator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --glass-bg: rgba(255, 255, 255, 0.98);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Color Changing Company Name */
        .brand {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 20px;
            background: linear-gradient(to right, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            background-size: 400% 400%;
            animation: rainbow-flow 8s ease infinite;
            letter-spacing: -1px;
        }

        @keyframes rainbow-flow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-card {
            background: var(--glass-bg);
            padding: 2rem;
            border-radius: 28px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 90%;
            max-width: 380px;
            text-align: center;
        }

        header h2 { font-size: 1.2rem; margin-bottom: 1.5rem; color: #1e293b; }

        .input-group { text-align: left; margin-bottom: 1.5rem; }
        .input-group label { font-size: 0.75rem; font-weight: 700; color: #64748b; text-transform: uppercase; margin-left: 5px; }

        select {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            border: 2px solid #f1f5f9;
            background: #f8fafc;
            font-size: 1rem;
            font-weight: 500;
            outline: none;
            margin-top: 5px;
        }

        .mic-button {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: none;
            background: var(--primary);
            color: white;
            font-size: 2rem;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
        }

        .listening {
            background: #ef4444 !important;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        #status { margin-top: 15px; font-size: 0.85rem; color: #64748b; font-weight: 500; }

        .result-box {
            margin-top: 20px;
            background: #f1f5f9;
            padding: 1.2rem;
            border-radius: 16px;
            min-height: 60px;
            text-align: left;
            border-left: 4px solid var(--primary);
        }

        #output { font-size: 1rem; color: #1e293b; line-height: 1.5; font-weight: 500; }
    </style>
</head>
<body>

    <div class="brand">Flexidigit.ai</div>

    <div class="glass-card">
        <header>
            <h2>Voice Translator</h2>
        </header>

        <div class="input-group">
            <label>Speak in</label>
            <select id="languageSelect">
                <option value="hi-IN">Hindi (हिंदी)</option>
                <option value="ta-IN">Tamil (தமிழ்)</option>
                <option value="ml-IN">Malayalam (മലയാളം)</option>
            </select>
        </div>

        <button id="startBtn" class="mic-button">🎤</button>
        <p id="status">Ready to translate</p>

        <div class="result-box">
            <p id="output">English translation will appear here...</p>
        </div>
    </div>

    <script>
        const startBtn = document.getElementById('startBtn');
        const output = document.getElementById('output');
        const statusText = document.getElementById('status');
        const langSelect = document.getElementById('languageSelect');

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (!SpeechRecognition) {
            statusText.innerText = "Browser not supported. Please use Chrome.";
        } else {
            const recognition = new SpeechRecognition();
            
            startBtn.onclick = () => recognition.start();

            recognition.onstart = () => {
                startBtn.classList.add('listening');
                statusText.innerText = "Listening...";
                output.innerText = "...";
            };

            recognition.onspeechend = () => {
                recognition.stop();
                startBtn.classList.remove('listening');
            };

            recognition.onresult = async (event) => {
                const transcript = event.results[0][0].transcript;
                const srcLang = langSelect.value.split('-')[0];
                statusText.innerText = "Translating...";

                try {
                    const response = await fetch('/translate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ text: transcript, src: srcLang })
                    });
                    
                    const data = await response.json();
                    output.innerText = data.translated_text;
                    statusText.innerText = "Done!";

                    const synth = window.speechSynthesis;
                    const utter = new SpeechSynthesisUtterance(data.translated_text);
                    utter.lang = 'en-US';
                    synth.speak(utter);

                } catch (err) {
                    statusText.innerText = "Connection error.";
                }
            };
        }
    </script>
</body>
</html>
